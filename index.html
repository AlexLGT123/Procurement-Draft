    <style>
      /* Prevent layout shift when scrollbar appears */
      html {
        overflow-y: scroll;
        scrollbar-width: thin; /* For Firefox */
        scrollbar-color: #4B5563 #1A1A1A; /* For Firefox */
      }

      /* Custom scrollbar for webkit browsers */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1A1A1A;
      }
      ::-webkit-scrollbar-thumb {
        background: #4B5563;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6B7280;
      }
      
      @keyframes highlight-fade-in {
        from { background-color: rgba(127, 86, 217, 0); }
        to { background-color: rgba(127, 86, 217, 0.25); }
      }

      mark {
        background-color: rgba(127, 86, 217, 0.25); /* Purple accent with 25% opacity */
        color: inherit;
        border-radius: 3px;
        padding: 0 2px;
        animation: highlight-fade-in 0.5s ease-in-out;
        transition: background-color 0.5s ease-out;
      }
    </style>
